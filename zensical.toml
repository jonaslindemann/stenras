[project]
site_name = "Stenras!"
site_description = "Programmera ett eget grottspel i Processing"
site_author = "Jonas Lindemann"
copyright = """
Copyright &copy; 2024–2026 Jonas Lindemann
"""

nav = [
    { "Start" = "index.md" },
    { "Del 1 – Grottan" = "del1.md" },
    { "Del 2 – Spelaren" = "del2.md" },
    { "Del 3 – Menyer och poäng" = "del3.md" },
    { "Ladda ner kod" = "nedladdning.md" },
]

[project.theme]
language = "sv"
features = [
    "content.code.copy",
    "content.code.select",
    "content.code.annotate",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Byt till mörkt läge"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Byt till ljust läge"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.superfences]
